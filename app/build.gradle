plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ysmod.hook'
    compileSdk 34

    defaultConfig {
        applicationId "com.ysmod.hook"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "1.9"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17 -O2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    compileOnly project(':xposed-stub')
}

